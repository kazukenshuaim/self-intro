{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>自己紹介一覧</h2>
    {# + 新規自己紹介 ボタンは Day 7 で追加 #}
</div>

{% if intros %}
<table class="table table-hover">
    <thead>
        <tr>
            <th>名前</th>
            <th>更新日時</th>
        </tr>
    </thead>
    <tbody>
        {% for intro in intros %}
        <tr>
            <td>
                <a href="{% url 'intros:intro_detail' intro.pk %}">{{ intro.name }}</a>
            </td>
            <td>{{ intro.created_at|date:"Y年m月d日"|default:'-' }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="alert alert-info">自己紹介がありません。新規自己紹介を作成してください。</div>
{% endif %}
{% endblock %}
